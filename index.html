<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoFlo</title>
<meta name="description" content="Kasir bengkel AutoFlo: nota, stok, dan laporan yang tersimpan di Google Sheets.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AutoFlo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --putih: #ffffff;
  --kabut: #f5f7fc;
  --tinta: #0f1535;
  --tinta-2: #56607f;
  --tinta-3: #8c94ae;
  --garis: #e7eaf3;
  --biru: #1f55f0;
  --ungu: #0a84a0;
  --teal: #0e9f8e;        /* pemasukan */
  --teal-teks: #0b7d70;
  --teal-lembut: #e3f6f3;
  --indigo: #5b5bf0;      /* pengeluaran */
  --indigo-lembut: #ececff;
  --bahaya: #d6336c;
  --gradasi: linear-gradient(135deg, #1f55f0 0%, #0a84a0 100%);
  --huruf: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --angka: "Sora", "Plus Jakarta Sans", system-ui, sans-serif;
  --aman-bawah: env(safe-area-inset-bottom, 0px);
  --nav: 68px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: #eceff8; }
body {
  margin: 0; font-family: var(--huruf); color: var(--tinta); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; border-radius: 8px; }
svg.ik { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--putih); position: relative; }

/* ---------- Layar masuk ---------- */
.masuk { min-height: 100dvh; padding: 56px 24px 32px; display: flex; flex-direction: column; background:
  radial-gradient(120% 60% at 100% 0%, rgba(10,132,160,.13), transparent 60%),
  radial-gradient(90% 50% at 0% 10%, rgba(45,212,191,.14), transparent 60%), var(--putih); }
.masuk .logo { width: 60px; height: 60px; border-radius: 18px; background: var(--gradasi); display: grid; place-items: center; color: #fff; box-shadow: 0 12px 28px -10px rgba(31,85,240,.6); }
.masuk h1 { font-family: var(--angka); font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 28px 0 8px; }
.masuk p.pengantar { color: var(--tinta-2); margin: 0 0 28px; max-width: 34ch; }
.kolom { display: block; margin-bottom: 16px; }
.kolom > span { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.kolom small { display: block; color: var(--tinta-3); font-size: 12.5px; margin-top: 6px; }
.isian { width: 100%; height: 52px; border: 1.5px solid var(--garis); border-radius: 14px; padding: 0 14px; font-size: 16px; background: var(--putih); transition: border-color .15s; }
.isian:focus { outline: none; border-color: var(--biru); }
.isian.pin { letter-spacing: .4em; font-family: var(--angka); font-size: 20px; }
.tombol { height: 54px; border-radius: 16px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; transition: transform .12s, opacity .15s; }
.tombol:active { transform: scale(.98); }
.tombol.utama { background: var(--gradasi); color: #fff; width: 100%; box-shadow: 0 14px 28px -14px rgba(31,85,240,.75); }
.tombol.sekunder { background: var(--kabut); color: var(--tinta); }
.tombol.bahaya { background: #fdecf2; color: var(--bahaya); }
.tombol[disabled] { opacity: .6; pointer-events: none; }
.tautan { color: var(--biru); font-weight: 600; padding: 12px 4px; }
.galat { color: var(--bahaya); font-size: 13.5px; font-weight: 500; margin: 0 0 12px; min-height: 0; }
.putar { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; animation: putar .7s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }

/* ---------- Kerangka utama ---------- */
.atas { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 10px; background: rgba(255,255,255,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.atas h1 { font-family: var(--angka); font-size: 22px; letter-spacing: -.02em; margin: 0; }
.bulat { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--kabut); color: var(--tinta-2); }
.bulat.memuat svg { animation: putar .9s linear infinite; }
main { padding: 4px 20px calc(var(--nav) + var(--aman-bawah) + 40px); }
.layar { animation: muncul .22s ease both; }
@keyframes muncul { from { opacity: 0; transform: translateY(6px); } }
.pita { background: #fff7e0; color: #7a5200; font-size: 13px; font-weight: 600; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pita button { color: inherit; text-decoration: underline; font-weight: 700; }

/* ---------- Periode ---------- */
.periode { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 4px -20px 14px; padding: 2px 20px; }
.periode::-webkit-scrollbar { display: none; }
.keping { height: 40px; padding: 0 15px; border-radius: 999px; background: var(--kabut); color: var(--tinta-2); font-weight: 600; font-size: 14px; white-space: nowrap; flex: none; transition: background .15s, color .15s; }
.keping.aktif { background: var(--tinta); color: #fff; }
.rentang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: -4px 0 14px; }
.rentang label { font-size: 12px; color: var(--tinta-3); font-weight: 600; }
.rentang .isian { height: 46px; margin-top: 4px; font-size: 15px; }

/* ---------- Kartu saldo ---------- */
.saldo { position: relative; overflow: hidden; border-radius: 28px; padding: 22px 20px 18px; color: #fff; background:
  radial-gradient(70% 90% at 105% -10%, rgba(110,225,255,.42), transparent 60%),
  radial-gradient(60% 70% at -10% 110%, rgba(255,255,255,.16), transparent 60%), var(--gradasi);
  box-shadow: 0 24px 40px -24px rgba(20,80,200,.75); }
.saldo .ket { font-size: 13.5px; opacity: .9; font-weight: 500; }
.saldo .atas-saldo { display: flex; justify-content: space-between; gap: 12px; }
.saldo .besar { font-family: var(--angka); font-weight: 700; font-size: clamp(30px, 9.5vw, 40px); letter-spacing: -.03em; line-height: 1.1; margin: 6px 0 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.saldo .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kaca { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 18px; padding: 12px 12px 11px; min-width: 0; }
.kaca .ket { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.kaca .ket svg { width: 16px; height: 16px; stroke-width: 2.2; }
.kaca b { display: block; font-family: var(--angka); font-weight: 600; font-size: 15.5px; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.saldo .kini { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.22); font-size: 13.5px; }
.saldo .kini b { font-family: var(--angka); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Blok isi ---------- */
.blok { margin-top: 26px; }
.blok > header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.blok h2 { font-family: var(--angka); font-size: 16.5px; letter-spacing: -.01em; margin: 0; }
.blok .sub { color: var(--tinta-3); font-size: 12.5px; margin: 2px 0 0; }
.panel { border: 1px solid var(--garis); border-radius: 22px; padding: 16px; }
.wawasan { list-style: none; margin: 0; padding: 0; }
.wawasan li { display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; }
.wawasan li + li { border-top: 1px solid var(--garis); }
.wawasan li:first-child { padding-top: 2px; } .wawasan li:last-child { padding-bottom: 2px; }
.wawasan .tanda { width: 34px; height: 34px; border-radius: 11px; background: var(--kabut); color: var(--biru); display: grid; place-items: center; }
.wawasan .tanda svg { width: 18px; height: 18px; }
.wawasan p { margin: 0; color: var(--tinta-2); font-size: 14px; }
.wawasan p b { color: var(--tinta); font-weight: 700; }

/* ---------- Daftar transaksi ---------- */
.daftar { list-style: none; margin: 0; padding: 0; }
.trx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 0; min-height: 60px; }
.daftar li + li .trx { border-top: 1px solid var(--garis); }
.trx .tanda { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; }
.trx .tanda svg { width: 19px; height: 19px; stroke-width: 2.1; }
.trx.masuk-uang .tanda { background: var(--teal-lembut); color: var(--teal); }
.trx.keluar-uang .tanda { background: var(--indigo-lembut); color: var(--indigo); }
.trx .teks { flex: 1; min-width: 0; }
.trx .teks b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trx .teks span { display: block; color: var(--tinta-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trx .jumlah { font-family: var(--angka); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.trx.masuk-uang .jumlah { color: var(--teal-teks); }
.trx .tunda { display: flex; align-items: center; gap: 4px; justify-content: flex-end; color: var(--tinta-3); font-family: var(--huruf); font-weight: 500; font-size: 11.5px; }
.trx .tunda svg { width: 12px; height: 12px; }
.hari { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 2px; font-size: 13px; font-weight: 700; color: var(--tinta-2); }
.hari span { font-weight: 500; color: var(--tinta-3); font-variant-numeric: tabular-nums; }

/* ---------- Kosong dan kerangka muat ---------- */
.kosong { text-align: center; padding: 34px 12px 10px; }
.kosong > svg { width: 92px; height: 92px; }
.kosong h3 { font-family: var(--angka); font-size: 17px; margin: 14px 0 4px; }
.kosong p { color: var(--tinta-2); margin: 0 auto 18px; max-width: 30ch; font-size: 14px; }
.kosong .tombol { height: 48px; font-size: 15px; }
.rangka { border-radius: 16px; background: linear-gradient(100deg, var(--kabut) 30%, #fff 50%, var(--kabut) 70%); background-size: 300% 100%; animation: kilau 1.2s linear infinite; }
@keyframes kilau { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ---------- Statistik ---------- */
.banding .baris { margin-bottom: 14px; }
.banding .label { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; }
.banding .label span { display: flex; align-items: center; gap: 8px; color: var(--tinta-2); font-weight: 600; }
.banding .label b { font-family: var(--angka); font-weight: 600; font-variant-numeric: tabular-nums; }
.titik { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.rel { height: 12px; border-radius: 6px; background: var(--kabut); overflow: hidden; }
.rel i { display: block; height: 100%; border-radius: 6px; min-width: 4px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.kalimat { margin: 2px 0 0; color: var(--tinta-2); font-size: 14px; }
.kalimat b { color: var(--tinta); }
.kat { display: block; width: 100%; text-align: left; padding: 9px 0; }
.kat .label { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 6px; }
.kat .label b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kat .label span { color: var(--tinta-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kat .rel { height: 8px; } .kat .rel i { background: var(--indigo); }
.saklar { display: inline-flex; background: var(--kabut); border-radius: 12px; padding: 3px; }
.saklar button { height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--tinta-2); }
.saklar button.aktif { background: var(--putih); color: var(--tinta); box-shadow: 0 1px 3px rgba(15,21,53,.12); }
.grafik { position: relative; margin-top: 8px; }
.grafik svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafik text { font-family: var(--huruf); font-size: 10px; fill: var(--tinta-3); }
.grafik .grid { stroke: var(--garis); stroke-width: 1; }
.grafik .kena { fill: transparent; }
.grafik .kena.aktif { fill: rgba(31,85,240,.07); }
.baca { min-height: 42px; display: flex; flex-wrap: wrap; align-content: center; gap: 2px 14px; font-size: 12.5px; color: var(--tinta-2); margin-bottom: 6px; }
.baca b { flex-basis: 100%; color: var(--tinta); font-weight: 600; font-size: 13px; }
.baca span { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legenda { display: flex; gap: 16px; font-size: 12.5px; color: var(--tinta-2); margin-top: 8px; }
.legenda span { display: flex; align-items: center; gap: 6px; }

/* ---------- Riwayat ---------- */
.cari { position: relative; margin-bottom: 10px; }
.cari svg { position: absolute; left: 14px; top: 15px; color: var(--tinta-3); }
.cari .isian { padding-left: 44px; background: var(--kabut); border-color: transparent; }
.cari .isian:focus { background: var(--putih); border-color: var(--biru); }
.saring { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
.saring .lebar { grid-column: 1 / -1; }
.saring label { font-size: 12px; color: var(--tinta-3); font-weight: 600; }
.saring .isian { height: 46px; margin-top: 4px; font-size: 15px; }
.ringkas { display: flex; justify-content: space-between; align-items: center; color: var(--tinta-3); font-size: 13px; margin-top: 12px; }

/* ---------- Pengaturan ---------- */
.kepingan { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.kepingan .k { display: inline-flex; align-items: center; gap: 2px; height: 38px; padding: 0 4px 0 14px; border-radius: 999px; background: var(--kabut); font-weight: 600; font-size: 13.5px; }
.kepingan .k button { width: 32px; height: 32px; display: grid; place-items: center; color: var(--tinta-3); border-radius: 50%; }
.kepingan .k button svg { width: 15px; height: 15px; }
.tambah-kat { display: flex; gap: 8px; }
.tambah-kat .isian { height: 48px; }
.tambah-kat .tombol { height: 48px; font-size: 14.5px; flex: none; }
.aturan p { color: var(--tinta-2); font-size: 13.5px; margin: 0 0 12px; }
.aturan .tumpuk { display: grid; gap: 10px; }
.uang { position: relative; flex: 1; }
.uang i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 600; color: var(--tinta-3); }
.uang .isian { padding-left: 44px; font-family: var(--angka); }

/* ---------- Navigasi bawah ---------- */
.bawah { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 10; padding: 0 12px calc(var(--aman-bawah) + 10px); pointer-events: none; }
.bawah .rak { pointer-events: auto; height: var(--nav); display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: center; background: rgba(255,255,255,.74); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border: 1px solid rgba(255,255,255,.9); border-radius: 26px; box-shadow: 0 16px 40px -16px rgba(15,21,53,.28), 0 0 0 1px rgba(15,21,53,.05); }
.bawah .tab { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--tinta-3); font-size: 11px; font-weight: 600; }
.bawah .tab.aktif { color: var(--biru); }
.bawah .plus { width: 62px; height: 62px; border-radius: 22px; margin: -22px auto 0; background: var(--gradasi); color: #fff; display: grid; place-items: center; box-shadow: 0 14px 26px -10px rgba(31,85,240,.85); transition: transform .12s; }
.bawah .plus:active { transform: scale(.94); }
.bawah .plus svg { width: 28px; height: 28px; stroke-width: 2.4; }

/* ---------- Lembar tambah/ubah ---------- */
.tirai { position: fixed; inset: 0; z-index: 20; background: rgba(15,21,53,.38); opacity: 0; transition: opacity .22s; display: flex; align-items: flex-end; justify-content: center; }
.tirai.buka { opacity: 1; }
.lembar { width: 100%; max-width: 480px; max-height: 94dvh; overflow-y: auto; background: var(--putih); border-radius: 28px 28px 0 0; padding: 10px 20px calc(var(--aman-bawah) + 18px); transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.85,.25,1); }
.tirai.buka .lembar { transform: none; }
.lembar .pegangan { width: 40px; height: 4px; border-radius: 2px; background: var(--garis); margin: 0 auto 10px; }
.lembar .kepala { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.lembar h2 { font-family: var(--angka); font-size: 18px; margin: 0; }
.jenis { display: grid; grid-template-columns: 1fr 1fr; background: var(--kabut); border-radius: 16px; padding: 4px; margin-bottom: 14px; }
.jenis button { height: 46px; border-radius: 13px; font-weight: 700; font-size: 14.5px; color: var(--tinta-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.jenis button svg { width: 17px; height: 17px; stroke-width: 2.2; }
.jenis button.aktif { background: var(--putih); box-shadow: 0 1px 4px rgba(15,21,53,.14); }
.jenis button.aktif[data-jenis="pengeluaran"] { color: var(--indigo); }
.jenis button.aktif[data-jenis="pemasukan"] { color: var(--teal-teks); }
.nominal { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--garis); padding: 4px 0 8px; margin-bottom: 16px; transition: border-color .15s; }
.nominal:focus-within { border-color: var(--biru); }
.nominal span { font-family: var(--angka); font-weight: 600; font-size: 20px; color: var(--tinta-3); }
.nominal input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-family: var(--angka); font-weight: 700; font-size: 34px; letter-spacing: -.02em; padding: 0; }
.nominal input::placeholder { color: #cfd4e3; }
.judul-kecil { font-size: 13px; font-weight: 600; color: var(--tinta-2); margin: 0 0 8px; }
.pilih-kat { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.pilih-kat button { min-height: 42px; padding: 0 15px; border-radius: 999px; background: var(--kabut); font-weight: 600; font-size: 14px; color: var(--tinta-2); border: 1.5px solid transparent; }
.pilih-kat button.aktif { background: #eaf1ff; border-color: var(--biru); color: var(--biru); }
.tgl { display: flex; gap: 8px; margin-bottom: 14px; }
.tgl .keping { height: 46px; }
.tgl .isian { height: 46px; flex: 1; min-width: 0; font-size: 15px; }
.aksi { display: flex; gap: 10px; margin-top: 6px; }
.aksi .bahaya { flex: none; width: 54px; padding: 0; }

/* ---------- Dialog dan toast ---------- */
.dialog { width: calc(100% - 48px); max-width: 360px; background: var(--putih); border-radius: 24px; padding: 22px 20px 18px; margin: auto; transform: scale(.94); transition: transform .2s; }
.tirai.tengah { align-items: center; }
.tirai.buka .dialog { transform: none; }
.dialog h2 { font-family: var(--angka); font-size: 18px; margin: 0 0 6px; }
.dialog p { color: var(--tinta-2); margin: 0 0 18px; font-size: 14.5px; }
.dialog .aksi .tombol { flex: 1; height: 50px; font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + var(--aman-bawah) + 26px); transform: translate(-50%, 16px); z-index: 40; max-width: min(440px, calc(100% - 32px)); width: max-content; background: var(--tinta); color: #fff; border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; display: flex; gap: 10px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 16px 30px -14px rgba(15,21,53,.6); }
.toast.tampil { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 18px; height: 18px; stroke-width: 2.4; }
.toast.ok svg { color: #5eead4; } .toast.gagal svg { color: #ff8fb1; } .toast.info svg { color: #b9c2ff; }

@media (min-width: 520px) { #app { box-shadow: 0 0 0 1px var(--garis); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ================= Tambahan AutoFlo ================= */
:root { --kuning-teks: #9a5b00; --kuning-lembut: #fff3dc; --abu-lembut: #eef0f6; }
.judul-atas { display: flex; align-items: center; gap: 10px; min-width: 0; }
.judul-atas h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tombol-segar { position: relative; }
#lencana-antre { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--kuning-teks); color: #fff; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.merek { display: none; }
.tombol.kecil { height: 42px; font-size: 14px; padding: 0 14px; border-radius: 13px; }
.tombol.kecil svg { width: 18px; height: 18px; }
.tombol.sekunder .putar, .tombol.bahaya .putar { border-color: rgba(15,21,53,.18); border-top-color: var(--tinta); }
.tombol.garis { background: none; border: 1.5px solid var(--garis); color: var(--tinta); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .kolom { min-width: 0; margin-bottom: 12px; }
.lembar .kolom { margin-bottom: 12px; }
.lembar .kolom > span { color: var(--tinta-2); }
.lembar .isian { height: 48px; }
.baris-alat { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 12px; }

/* lencana status */
.lencana { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 7px; font-family: var(--huruf); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.lencana.lunas { background: var(--teal-lembut); color: var(--teal-teks); }
.lencana.belum { background: var(--kuning-lembut); color: var(--kuning-teks); }
.lencana.batal { background: var(--abu-lembut); color: var(--tinta-2); }
.lencana.habis { background: #fdecf2; color: var(--bahaya); }
.trx .tanda { background: var(--kabut); color: var(--biru); }
.trx .jumlah { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.trx.redup { opacity: .55; }

/* kartu perhatian di beranda */
.perhatian { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.perhatian button { text-align: left; border: 1px solid var(--garis); border-radius: 20px; padding: 14px; min-width: 0; }
.perhatian .ket { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.perhatian .ket svg { width: 16px; height: 16px; }
.perhatian b { display: block; font-family: var(--angka); font-size: 17px; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.perhatian small { color: var(--tinta-3); font-size: 12px; }
.perhatian .ada .ket { color: var(--kuning-teks); }

/* menu Lainnya */
.menu { list-style: none; margin: 0; padding: 0; }
.menu button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 0; min-height: 64px; }
.menu li + li button { border-top: 1px solid var(--garis); }
.menu .tanda { width: 42px; height: 42px; border-radius: 14px; background: var(--kabut); color: var(--biru); display: grid; place-items: center; flex: none; }
.menu .teks { flex: 1; min-width: 0; }
.menu .teks b { display: block; font-weight: 600; }
.menu .teks span { display: block; color: var(--tinta-3); font-size: 13px; }
.menu > li > button > svg:last-child { color: var(--tinta-3); width: 18px; height: 18px; }
.akun { display: flex; align-items: center; gap: 12px; background: var(--kabut); border-radius: 20px; padding: 14px 16px; margin-bottom: 10px; }
.akun .tanda { width: 42px; height: 42px; border-radius: 50%; background: var(--gradasi); color: #fff; display: grid; place-items: center; font-family: var(--angka); font-weight: 700; }
.akun b { display: block; } .akun span { color: var(--tinta-2); font-size: 13px; }

/* tabel laporan */
.tabel { width: 100%; }
.tabel .b { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; font-size: 14.5px; }
.tabel .b + .b { border-top: 1px solid var(--garis); }
.tabel .b span { color: var(--tinta-2); min-width: 0; }
.tabel .b b { font-family: var(--angka); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabel .b.total { border-top: 2px solid var(--tinta); margin-top: 4px; padding-top: 12px; }
.tabel .b.total span { color: var(--tinta); font-weight: 700; }
.tabel .b.total b { font-size: 17px; }
.tabel .b.minus b { color: var(--tinta-2); }
.tabel .b.anak { padding-left: 14px; font-size: 13.5px; }

/* form nota */
.lembar.tinggi { min-height: 70dvh; }
.kenal { background: var(--teal-lembut); color: var(--teal-teks); border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 500; margin: -2px 0 12px; }
.item { border: 1px solid var(--garis); border-radius: 16px; padding: 12px; margin-bottom: 8px; }
.item-atas { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-atas b { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.item-atas small { display: block; color: var(--tinta-3); font-size: 12px; font-weight: 500; }
.item-atas button { width: 32px; height: 32px; margin: -4px -4px 0 0; display: grid; place-items: center; color: var(--tinta-3); border-radius: 50%; flex: none; }
.item-atas button svg { width: 16px; height: 16px; }
.item-bawah { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.langkah { display: flex; align-items: center; background: var(--kabut); border-radius: 12px; flex: none; }
.langkah button { width: 38px; height: 40px; font-size: 20px; font-weight: 600; color: var(--tinta-2); }
.langkah input { width: 44px; height: 40px; border: 0; background: none; text-align: center; font-family: var(--angka); font-weight: 600; font-size: 15px; padding: 0; outline: none; }
.item-bawah .kali { color: var(--tinta-3); }
.item-bawah .uang { flex: 1; min-width: 0; }
.item-bawah .uang .isian { height: 40px; font-size: 14.5px; padding-left: 38px; border-radius: 12px; }
.item-bawah .uang i { left: 11px; font-size: 13px; }
.item-atas .jml { font-family: var(--angka); font-weight: 600; font-size: 14.5px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
.awas { display: flex; align-items: center; gap: 6px; color: var(--kuning-teks); font-size: 12.5px; font-weight: 600; margin: 8px 0 0; }
.awas svg { width: 15px; height: 15px; }
.dua-tombol { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 16px; }
.dua-tombol .tombol { height: 48px; font-size: 14.5px; }
.jenis.tiga { grid-template-columns: repeat(3, 1fr); }
.jenis.tiga button { font-size: 13.5px; }
.jenis.tiga button.aktif { color: var(--biru); }
.hitung { background: var(--kabut); border-radius: 16px; padding: 6px 14px; margin: 12px 0 16px; }
.pilihan { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 0; min-height: 56px; }
.pilihan + .pilihan { border-top: 1px solid var(--garis); }
.pilihan .teks { flex: 1; min-width: 0; }
.pilihan .teks b { display: block; font-weight: 600; font-size: 14.5px; }
.pilihan .teks span { color: var(--tinta-3); font-size: 12.5px; }
.pilihan .harga { font-family: var(--angka); font-weight: 600; font-size: 14px; white-space: nowrap; }
.pilihan .kali-pilih { min-width: 26px; height: 26px; border-radius: 13px; background: var(--biru); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.manual { border-top: 1px solid var(--garis); margin-top: 14px; padding-top: 14px; }
.saklar-cek { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; margin: 4px 0 14px; }
.saklar-cek input { width: 22px; height: 22px; accent-color: var(--biru); }

/* kertas nota (tampilan, cetak) */
.kertas { border: 1px solid var(--garis); border-radius: 20px; padding: 18px 16px; font-size: 13.5px; background: #fff; color: #0f1535; }
.kertas .k-kepala { text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--garis); }
.kertas .k-kepala b { display: block; font-family: var(--angka); font-size: 20px; letter-spacing: -.01em; }
.kertas .k-kepala span { display: block; color: var(--tinta-2); font-size: 12.5px; }
.kertas dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 12px 0; }
.kertas dt { color: var(--tinta-2); } .kertas dd { margin: 0; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.kertas .k-jenis { color: var(--tinta-2); font-weight: 700; font-size: 12.5px; margin: 12px 0 4px; padding-top: 10px; border-top: 1px dashed #cfd4e3; }
.kertas .k-item { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.kertas .k-item div { min-width: 0; overflow-wrap: anywhere; }
.kertas .k-item small { display: block; color: var(--tinta-3); font-size: 12px; }
.kertas .k-item b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kertas .k-jumlah { border-top: 1px dashed #cfd4e3; margin-top: 10px; padding-top: 8px; }
.kertas .k-baris { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-variant-numeric: tabular-nums; }
.kertas .k-baris.besar { font-family: var(--angka); font-weight: 700; font-size: 17px; padding: 6px 0; }
.kertas .k-baris.redup { color: var(--tinta-2); font-size: 12.5px; }
.kertas .k-baris button { color: var(--bahaya); font-size: 12px; font-weight: 600; margin-left: 8px; text-decoration: underline; }
.kertas .k-cap { text-align: center; font-family: var(--angka); font-weight: 700; letter-spacing: .08em; margin-top: 10px; padding: 8px; border-radius: 10px; }
.kertas .k-cap.lunas { color: var(--teal-teks); background: var(--teal-lembut); }
.kertas .k-cap.belum { color: var(--kuning-teks); background: var(--kuning-lembut); }
.kertas .k-cap.batal { color: var(--tinta-2); background: var(--abu-lembut); }
.kertas .k-kaki { text-align: center; color: var(--tinta-2); font-size: 12.5px; margin-top: 12px; }
.aksi-nota { display: grid; gap: 10px; margin-top: 14px; }
.aksi-nota .tiga { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.aksi-nota .tiga .tombol { flex-direction: column; height: 64px; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 0 6px; }
.aksi-nota .tiga .tombol svg { width: 20px; height: 20px; }
.aksi-nota .teks-aksi { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
.catatan-tunda { display: flex; gap: 8px; align-items: center; background: var(--kuning-lembut); color: var(--kuning-teks); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 500; margin-bottom: 12px; }
.catatan-tunda svg { width: 16px; height: 16px; }
.stok-kini { display: flex; justify-content: space-between; align-items: center; background: var(--kabut); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
.stok-kini b { font-family: var(--angka); font-size: 20px; }

/* cetak */
#cetak { display: none; }
@media print {
  @page { margin: 6mm; }
  html, body { background: #fff !important; }
  #app { display: none !important; }
  #cetak { display: block; width: 100%; max-width: 92mm; }
  #cetak .kertas { border: 0; border-radius: 0; padding: 0; font-size: 12pt; }
  #cetak .k-baris button { display: none; }
}

/* layar lebar (PC, tablet mendatar) */
@media (min-width: 900px) {
  html { background: var(--kabut); }
  #app { max-width: none; background: var(--kabut); box-shadow: none; }
  #utama { padding-left: 248px; }
  .atas { max-width: 900px; margin: 0 auto; background: var(--kabut); backdrop-filter: none; padding: 26px 28px 14px; }
  .atas h1 { font-size: 26px; }
  .atas .bulat { background: var(--putih); }
  main { max-width: 900px; margin: 0 auto 32px; background: var(--putih); border-radius: 28px; padding: 22px 28px 36px; min-height: 72vh; }
  .periode { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .bawah { left: 0; top: 0; bottom: 0; transform: none; width: 248px; max-width: none; padding: 20px 14px; }
  .bawah .rak { height: 100%; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; border-radius: 24px; padding: 16px 12px; background: var(--putih); backdrop-filter: none; box-shadow: 0 0 0 1px var(--garis); }
  .merek { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-family: var(--angka); font-size: 19px; }
  .merek .logo-kecil { width: 36px; height: 36px; border-radius: 12px; background: var(--gradasi); color: #fff; display: grid; place-items: center; }
  .merek .logo-kecil svg { width: 20px; height: 20px; }
  .bawah .tab { flex-direction: row; justify-content: flex-start; gap: 12px; height: 48px; padding: 0 14px; font-size: 14.5px; border-radius: 14px; }
  .bawah .tab.aktif { background: #edf2ff; }
  .bawah .plus { order: 0; width: 100%; height: 52px; margin: 0 0 12px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bawah .plus::after { content: "Nota baru"; font-weight: 700; font-size: 15px; }
  .bawah .plus svg { width: 22px; height: 22px; }
  .bawah .merek { order: -2; } .bawah .plus { order: -1; }
  .tirai { align-items: center; padding: 24px; }
  .lembar { border-radius: 28px; max-width: 600px; max-height: 92dvh; }
  .lembar .pegangan { visibility: hidden; }
  .toast { bottom: 32px; left: calc(50% + 124px); }
  .masuk { max-width: 460px; margin: 0 auto; min-height: 0; margin-top: 6vh; border-radius: 28px; padding: 40px 32px; }
  .dua-lajur { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; align-items: start; }
}

<script>
'use strict';

/* ================= Alat bantu ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ikon = n => `<svg class="ik" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const tgl = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hariIni = () => iso(new Date());
const geserHari = (s, n) => { const d = tgl(s); d.setDate(d.getDate() + n); return iso(d); };
const jarakHari = (a, b) => Math.round((tgl(b) - tgl(a)) / 864e5);
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');
const angka = n => Math.abs(Math.round(n)).toLocaleString('id-ID');
const bil = s => Number(String(s == null ? '' : s).replace(/\D/g, '')) || 0;
const keQty = s => { const n = Number(String(s).replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const qtyT = q => (Math.round(q * 100) / 100).toLocaleString('id-ID');
const persen = n => (Math.round(n * 10) / 10).toLocaleString('id-ID') + '%';
function ringkas(n) {
  const f = (v, s) => (Math.round(v * 10) / 10).toLocaleString('id-ID') + s;
  if (n >= 1e9) return f(n / 1e9, ' M');
  if (n >= 1e6) return f(n / 1e6, ' jt');
  if (n >= 1e3) return f(n / 1e3, ' rb');
  return String(Math.round(n));
}
const fmt = opsi => new Intl.DateTimeFormat('id-ID', opsi);
const F_PANJANG = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const F_PENDEK = fmt({ day: 'numeric', month: 'short' });
const F_PENDEK_TH = fmt({ day: 'numeric', month: 'short', year: 'numeric' });
const F_BULAN = fmt({ month: 'long', year: 'numeric' });
const F_JAM = fmt({ hour: '2-digit', minute: '2-digit' });
const F_SINKRON = fmt({ day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function teksRentang(dari, sampai) {
  if (dari === sampai) return F_PENDEK_TH.format(tgl(dari));
  const a = tgl(dari), b = tgl(sampai);
  return (a.getFullYear() === b.getFullYear() ? F_PENDEK : F_PENDEK_TH).format(a) + ' – ' + F_PENDEK_TH.format(b);
}
const sebutHari = s => s === hariIni() ? 'Hari ini' : s === geserHari(hariIni(), -1) ? 'Kemarin' : F_PANJANG.format(tgl(s));
const ACAK = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const acak = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => ACAK[x % ACAK.length]).join('');
const idBaru = awalan => awalan + Date.now().toString(36) + acak(5).toLowerCase();
const idNota = () => { const d = new Date(); return 'AF-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + acak(4); };
function rapikanPlat(s) {
  s = String(s || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  const m = /^([A-Z]{1,2}) ?(\d{1,4}) ?([A-Z]{0,3})$/.exec(s);
  return m ? [m[1], m[2], m[3]].filter(Boolean).join(' ') : s;
}
const uangIsi = (id, nilai, lain) => `<div class="uang"><i>Rp</i><input class="isian" id="${id}" type="text" inputmode="numeric" autocomplete="off" data-i="uang${lain ? ' ' + lain : ''}" value="${nilai ? angka(nilai) : ''}" placeholder="0"></div>`;

const simpanan = {
  ambil(k, bawaan) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : bawaan; } catch (e) { return bawaan; } },
  taruh(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* penuh atau diblokir */ } },
  buang(k) { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
};
/* Salinan data untuk dibuka saat offline disimpan di IndexedDB (muat lebih banyak daripada localStorage). */
const kv = {
  db: null,
  buka() {
    return new Promise(ok => {
      try {
        const r = indexedDB.open('autoflo', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { kv.db = r.result; ok(); };
        r.onerror = () => ok();
      } catch (e) { ok(); }
    });
  },
  ambil(k) {
    return new Promise(ok => {
      if (!kv.db) return ok(null);
      try { const r = kv.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); } catch (e) { ok(null); }
    });
  },
  taruh(k, v) { try { if (kv.db) kv.db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) { /* abaikan */ } },
  buang(k) { try { if (kv.db) kv.db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { /* abaikan */ } }
};

/* ================= Keadaan aplikasi ================= */
const K = { cfg: 'af_cfg', antre: 'af_antre' };
const METODE = ['Tunai', 'Transfer', 'QRIS'];
const KOSONG = {
  versi: '', nota: [], barang: [], jasa: [], pengeluaran: [], belanja: [], pengguna: [],
  pengaturan: { nama: 'AutoFlo', alamat: '', telepon: '', kaki: 'Terima kasih atas kepercayaan Anda.', mekanik: [],
    kategoriPengeluaran: ['Listrik & Air', 'Gaji', 'Sewa', 'Peralatan', 'Operasional', 'Konsumsi', 'Lainnya'] }
};
const st = {
  cfg: simpanan.ambil(K.cfg, { url: '', token: '', pengguna: null }),
  server: KOSONG, data: KOSONG, antre: simpanan.ambil(K.antre, []),
  waktuSinkron: 0, pernahMuat: false, memuat: false, mengirim: false, demo: false,
  layar: 'beranda', periode: { mode: 'hari', dari: '', sampai: '' }, batas: 60,
  fNota: { q: '', status: 'semua' }, fStok: { tab: 'sparepart', q: '', menipis: false }, fKend: { q: '' },
  fn: null, fb: null, fp: null, pilih: null, notaBuka: null,
  terkirim: []   // sudah diterima server tetapi belum muncul di data yang dimuat; tetap ditampilkan supaya tidak berkedip hilang
};
const bos = () => !!st.cfg.pengguna && st.cfg.pengguna.peran === 'pemilik';
const namaSaya = () => (st.cfg.pengguna && st.cfg.pengguna.nama) || '';
const notaById = id => st.data.nota.find(n => n.id === id);
const simpanAntre = () => { if (!st.demo) simpanan.taruh(K.antre, st.antre); };

/* ================= Komunikasi dengan Apps Script ================= */
function galat(kode, pesan) { return Object.assign(new Error(pesan), { kode }); }

async function api(aksi, data = {}) {
  if (st.demo) { await new Promise(r => setTimeout(r, 300)); return { ok: true, sama: true }; }
  const kendali = new AbortController();
  const waktu = setTimeout(() => kendali.abort(), 40000);
  let res;
  try {
    res = await fetch(st.cfg.url, {
      method: 'POST', redirect: 'follow', signal: kendali.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain supaya tidak kena pemeriksaan CORS
      body: JSON.stringify({ aksi, token: st.cfg.token, ...data })
    });
  } catch (e) {
    throw galat('JARINGAN', 'Tidak ada koneksi ke server.');
  } finally { clearTimeout(waktu); }
  let json;
  try { json = await res.json(); }
  catch (e) { throw galat('URL', 'Alamat Apps Script tidak merespons dengan benar. Periksa alamatnya dan pastikan aksesnya "Siapa saja".'); }
  if (!json.ok) {
    if (json.kode === 'SESI') { st.cfg.token = ''; simpanan.taruh(K.cfg, st.cfg); tampilMasuk(); }
    throw galat(json.kode || 'GALAT', json.pesan || 'Terjadi kesalahan.');
  }
  return json;
}

/* ================= Data ================= */
function terima(d) {
  st.server = { versi: d.versi, nota: d.nota, barang: d.barang, jasa: d.jasa, pengeluaran: d.pengeluaran, belanja: d.belanja, pengguna: d.pengguna, pengaturan: d.pengaturan };
  if (d.saya) { st.cfg.pengguna = d.saya; simpanan.taruh(K.cfg, st.cfg); }
  st.waktuSinkron = Date.now(); st.pernahMuat = true;
  kv.taruh('data', { server: st.server, waktu: st.waktuSinkron });
  const nota = new Set(d.nota.map(n => n.id)), bayar = new Set(d.nota.flatMap(n => n.bayar.map(b => b.id))), keluar = new Set(d.pengeluaran.map(p => p.id)), kini = Date.now();
  st.terkirim = st.terkirim.filter(x => kini - x.waktu < 120000 &&
    !(x.op.aksi === 'simpanNota' ? nota.has(x.op.nota.id) : x.op.aksi === 'bayar' ? bayar.has(x.op.bayar.id) : keluar.has(x.op.pengeluaran.id)));
  bangun();
}

/** Data yang ditampilkan = data server + transaksi di antrean yang belum terkirim. */
function bangun() {
  const s = st.server;
  const d = { ...s, nota: s.nota.slice(), barang: s.barang.slice(), pengeluaran: s.pengeluaran.slice() };
  const iNota = new Map(d.nota.map((n, i) => [n.id, i])), iBrg = new Map(d.barang.map((b, i) => [b.kode, i]));
  for (const [op, tunda] of [...st.terkirim.map(x => [x.op, false]), ...st.antre.map(op => [op, true])]) {
    if (op.aksi === 'simpanNota') {
      const p = op.nota;
      if (iNota.has(p.id)) continue;
      const items = p.items.map(it => { const i = iBrg.get(it.kode); return { ...it, modal: it.jenis === 'sparepart' && i != null ? d.barang[i].modal : 0 }; });
      const subtotal = items.reduce((a, it) => a + Math.round(it.qty * it.harga), 0), total = subtotal - (p.diskon || 0), dibayar = p.bayar ? p.bayar.jumlah : 0;
      d.nota.push({ id: p.id, tanggal: p.tanggal, pelanggan: p.pelanggan, hp: p.hp, plat: p.plat, kendaraan: p.kendaraan, km: p.km, mekanik: p.mekanik,
        subtotal, diskon: p.diskon || 0, total, dibayar, sisa: total - dibayar, status: total - dibayar <= 0 ? 'LUNAS' : 'BELUM LUNAS', catatan: p.catatan,
        kasir: namaSaya(), dibuat: p.waktu, items, tunda,
        bayar: p.bayar ? [{ id: p.bayar.id, tanggal: p.tanggal, metode: p.bayar.metode, jumlah: dibayar, kasir: namaSaya(), dibuat: p.waktu }] : [] });
      iNota.set(p.id, d.nota.length - 1);
      for (const it of items) {
        const i = iBrg.get(it.kode);
        if (it.jenis === 'sparepart' && i != null) d.barang[i] = { ...d.barang[i], stok: Math.round((d.barang[i].stok - it.qty) * 100) / 100 };
      }
    } else if (op.aksi === 'bayar') {
      const b = op.bayar, i = iNota.get(b.notaId);
      if (i == null || d.nota[i].bayar.some(x => x.id === b.id)) continue;
      const n = d.nota[i], dibayar = n.dibayar + b.jumlah;
      d.nota[i] = { ...n, dibayar, sisa: n.total - dibayar, status: n.total - dibayar <= 0 ? 'LUNAS' : 'BELUM LUNAS', tunda: tunda || n.tunda,
        bayar: [...n.bayar, { id: b.id, tanggal: b.tanggal, metode: b.metode, jumlah: b.jumlah, kasir: namaSaya(), dibuat: b.waktu }] };
    } else if (op.aksi === 'simpanPengeluaran') {
      const p = op.pengeluaran;
      if (!d.pengeluaran.some(x => x.id === p.id)) d.pengeluaran.push({ ...p, kasir: namaSaya(), dibuat: p.waktu, tunda });
    }
  }
  d.nota.sort((a, b) => a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : b.dibuat - a.dibuat);
  d.pengeluaran.sort((a, b) => a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : b.dibuat - a.dibuat);
  st.data = d;
}

async function muat(beriKabar, paksa) {
  if (st.memuat || st.demo) { if (st.demo && beriKabar) toast('Mode demo tidak terhubung ke spreadsheet.', 'info'); return; }
  st.memuat = true; $('#tombol-segar').classList.add('memuat');
  try {
    const d = await api('muat', { versi: paksa ? '' : st.server.versi });
    if (d.sama) { st.waktuSinkron = Date.now(); st.pernahMuat = true; } else terima(d);
    if (beriKabar) toast('Data sudah yang terbaru.', 'ok');
  } catch (e) {
    if (beriKabar || !st.pernahMuat) toast(e.kode === 'JARINGAN' ? 'Tidak ada koneksi. Menampilkan data terakhir yang tersimpan di perangkat ini.' : e.message, e.kode === 'JARINGAN' ? 'info' : 'gagal');
    st.pernahMuat = true;
  } finally {
    st.memuat = false; $('#tombol-segar').classList.remove('memuat');
    gambar();
  }
}

/** Mengirim antrean satu per satu, dari yang paling lama. Aman dikirim ulang: server mengenali ID yang sama. */
async function kirimAntrean(beriKabar) {
  if (st.mengirim || !st.antre.length) return;
  st.mengirim = true;
  let terkirim = 0;
  try {
    while (st.antre.length) {
      const { aksi, ...isi } = st.antre[0];
      try {
        await api(aksi, isi);
        if (st.demo) { bangun(); st.server = { ...st.data, nota: st.data.nota.map(n => n.tunda ? { ...n, tunda: false } : n), pengeluaran: st.data.pengeluaran.map(p => p.tunda ? { ...p, tunda: false } : p) }; }
        else st.terkirim.push({ op: st.antre[0], waktu: Date.now() });
        st.antre.shift(); terkirim++;
      } catch (e) {
        if (e.kode === 'VALIDASI' || e.kode === 'TIDAK_ADA') { st.antre.shift(); toast('Ditolak server: ' + e.message, 'gagal'); continue; }
        if (beriKabar) toast(e.kode === 'JARINGAN' ? 'Tidak ada koneksi. Disimpan di perangkat ini dan dikirim otomatis saat online.' : 'Belum terkirim: ' + e.message, e.kode === 'JARINGAN' ? 'info' : 'gagal');
        break;
      }
    }
    if (terkirim && beriKabar && !st.antre.length) toast('Tersimpan ke spreadsheet.', 'ok');
  } finally {
    st.mengirim = false; simpanAntre(); bangun(); gambar();
    if (terkirim) muat(false);
  }
}

/** Untuk aksi yang perlu online: kirim, terima data terbaru, tampilkan hasilnya. */
async function kirim(aksi, data, tombol, pesanOk) {
  if (st.demo) { toast('Di mode demo, bagian ini hanya bisa dilihat.', 'info'); return false; }
  const teks = tombol ? tombol.innerHTML : '';
  if (tombol) { tombol.disabled = true; tombol.innerHTML = '<span class="putar"></span>Menyimpan'; }
  try {
    const d = await api(aksi, data);
    if (d.nota) { terima(d); gambar(); } else await muat(false, true);   // sebagian aksi tidak mengembalikan data lengkap
    if (pesanOk) toast(pesanOk, 'ok');
    return true;
  } catch (e) {
    toast(e.kode === 'JARINGAN' ? 'Bagian ini perlu internet. Coba lagi saat online.' : e.message, 'gagal');
    return false;
  } finally { if (tombol) { tombol.disabled = false; tombol.innerHTML = teks; } }
}

/* ================= Periode dan hitungan ================= */
function rentang() {
  const h = hariIni(), p = st.periode;
  if (p.mode === 'hari') return { dari: h, sampai: h };
  if (p.mode === 'minggu') { const dari = geserHari(h, -((tgl(h).getDay() + 6) % 7)); return { dari, sampai: geserHari(dari, 6) }; }
  if (p.mode === 'pilih' && p.dari && p.sampai) return p.dari <= p.sampai ? { dari: p.dari, sampai: p.sampai } : { dari: p.sampai, sampai: p.dari };
  const d = tgl(h);
  return { dari: iso(new Date(d.getFullYear(), d.getMonth(), 1)), sampai: iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
}
function labelPeriode(r) {
  const m = st.periode.mode;
  if (m === 'hari') return 'Hari ini, ' + F_PENDEK_TH.format(tgl(r.dari));
  if (m === 'bulan') return F_BULAN.format(tgl(r.dari));
  return teksRentang(r.dari, r.sampai);
}
const dalam = (t, r) => t >= r.dari && t <= r.sampai;

function ringkasan(r) {
  const sah = st.data.nota.filter(n => n.status !== 'BATAL'), nota = sah.filter(n => dalam(n.tanggal, r));
  let jasa = 0, part = 0, diskon = 0, bersih = 0, modal = 0, uang = 0;
  const masuk = { Tunai: 0, Transfer: 0, QRIS: 0 };
  for (const n of nota) {
    diskon += n.diskon; bersih += n.total;
    for (const it of n.items) { const j = Math.round(it.qty * it.harga); if (it.jenis === 'jasa') jasa += j; else { part += j; modal += Math.round(it.qty * (it.modal || 0)); } }
  }
  for (const n of sah) for (const b of n.bayar) if (dalam(b.tanggal, r)) { masuk[b.metode] = (masuk[b.metode] || 0) + b.jumlah; uang += b.jumlah; }
  const keluar = st.data.pengeluaran.filter(p => dalam(p.tanggal, r)).reduce((a, p) => a + p.nominal, 0);
  const belanja = st.data.belanja.filter(p => dalam(p.tanggal, r)).reduce((a, p) => a + p.nilai, 0);
  return { nota, jasa, part, diskon, bersih, modal, masuk, uang, keluar, belanja, laba: bersih - modal - keluar, kas: uang - keluar - belanja };
}
const piutang = () => st.data.nota.filter(n => n.status === 'BELUM LUNAS');
const menipis = () => st.data.barang.filter(b => b.aktif && b.stok <= b.min);

function daftarKendaraan() {
  const peta = new Map();
  for (const n of st.data.nota) {          // nota sudah urut dari yang terbaru
    if (!n.plat || n.status === 'BATAL') continue;
    let k = peta.get(n.plat);
    if (!k) peta.set(n.plat, k = { plat: n.plat, kendaraan: '', pelanggan: '', hp: '', kali: 0, total: 0, terakhir: n.tanggal });
    k.kali++; k.total += n.total;
    if (!k.kendaraan) k.kendaraan = n.kendaraan; if (!k.pelanggan) k.pelanggan = n.pelanggan; if (!k.hp) k.hp = n.hp;
  }
  return peta;
}

function dataHarian(r) {
  const h = hariIni();
  let sampai = r.sampai > h && r.dari <= h ? h : r.sampai, dari = r.dari;
  if (jarakHari(dari, sampai) < 6) dari = geserHari(sampai, -6);
  if (jarakHari(dari, sampai) > 30) dari = geserHari(sampai, -30);
  const peta = new Map();
  for (const n of st.data.nota) if (n.status !== 'BATAL' && n.tanggal >= dari && n.tanggal <= sampai) peta.set(n.tanggal, (peta.get(n.tanggal) || 0) + n.total);
  const data = [], n = jarakHari(dari, sampai) + 1, langkah = Math.ceil(n / 6);
  for (let i = 0; i < n; i++) {
    const s = geserHari(dari, i), d = tgl(s);
    data.push({ label: i % langkah === 0 ? (d.getDate() === 1 || i === 0 ? F_PENDEK.format(d) : String(d.getDate())) : '', judul: F_PANJANG.format(d), nilai: [peta.get(s) || 0] });
  }
  return { data, seri: [{ nama: 'Penjualan', warna: 'var(--biru)' }], ket: teksRentang(dari, sampai) };
}

function batasBulat(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
/** Grafik batang SVG. data: [{label, judul, nilai:[..]}], seri: [{nama, warna}] */
function grafikBatang(el, data, seri) {
  const L = 340, T = 168, kiri = 40, kanan = 4, atas = 10, bawah = 22;
  const lebar = L - kiri - kanan, tinggi = T - atas - bawah, dasar = atas + tinggi;
  const maks = batasBulat(Math.max(1, ...data.flatMap(d => d.nilai)));
  const lajur = lebar / data.length, n = seri.length, sela = n > 1 ? 2 : 0;
  const lb = Math.max(2, Math.min(20, (lajur * (n > 1 ? .62 : .68) - sela * (n - 1)) / n));
  let s = `<svg viewBox="0 0 ${L} ${T}" role="img" aria-label="Grafik batang ${esc(seri.map(x => x.nama).join(' dan '))}">`;
  for (const f of [0, .5, 1]) {
    const y = dasar - tinggi * f;
    s += `<line class="grid" x1="${kiri}" x2="${L - kanan}" y1="${y}" y2="${y}"/><text x="${kiri - 6}" y="${y + 3.5}" text-anchor="end">${f ? ringkas(maks * f) : '0'}</text>`;
  }
  data.forEach((d, i) => {
    const x0 = kiri + lajur * i, tengah = x0 + lajur / 2, awal = tengah - (lb * n + sela * (n - 1)) / 2;
    s += `<rect class="kena" data-i="${i}" x="${x0}" y="${atas - 4}" width="${lajur}" height="${tinggi + 4}" rx="6"/>`;
    d.nilai.forEach((v, k) => {
      if (v <= 0) return;
      const t = Math.max(2, tinggi * v / maks), x = awal + k * (lb + sela), y = dasar - t, q = Math.min(4, lb / 2, t);
      s += `<path pointer-events="none" fill="${seri[k].warna}" d="M${x} ${dasar}V${y + q}Q${x} ${y} ${x + q} ${y}H${x + lb - q}Q${x + lb} ${y} ${x + lb} ${y + q}V${dasar}Z"/>`;
    });
    if (d.label) s += `<text x="${tengah}" y="${T - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  el.innerHTML = '<div class="baca" aria-live="polite"></div>' + s + '</svg>';
  const baca = $('.baca', el);
  const sorot = i => {
    $$('.kena', el).forEach(k => k.classList.toggle('aktif', +k.dataset.i === i));
    baca.innerHTML = `<b>${esc(data[i].judul)}</b>` + seri.map((x, k) => `<span><i class="titik" style="background:${x.warna}"></i>${x.nama} ${rp(data[i].nilai[k])}</span>`).join('');
  };
  sorot(data.length - 1);
  el.onpointerover = e => { const k = e.target.closest('.kena'); if (k) sorot(+k.dataset.i); };
  el.onclick = e => { const k = e.target.closest('.kena'); if (k) sorot(+k.dataset.i); };
}

  const r = rentang(), x = ringkasan(r), b = (label, nilai, kelas) => `<div class="b ${kelas || ''}"><span>${label}</span><b>${nilai}</b></div>`;
  const laris = jenis => {
    const peta = new Map();
    for (const n of x.nota) for (const it of n.items) if (it.jenis === jenis) { const k = peta.get(it.nama) || { nama: it.nama, qty: 0, nilai: 0 }; k.qty += it.qty; k.nilai += Math.round(it.qty * it.harga); peta.set(it.nama, k); }
    return [...peta.values()].sort((a, c) => c.nilai - a.nilai).slice(0, 5);
  };

/* ================= Lembar, dialog, toast ================= */
function lembar(judul, isi, opsi = {}) {
  const t = document.createElement('div');
  t.className = 'tirai'; if (opsi.id) t.id = opsi.id;
  t.innerHTML = `<div class="lembar ${opsi.kelas || ''}" role="dialog" aria-modal="true"><div class="pegangan"></div>
    <div class="kepala"><h2>${esc(judul)}</h2><button class="bulat" type="button" data-a="tutup" aria-label="Tutup">${ikon('tutup')}</button></div><div class="isi-lembar">${isi}</div></div>`;
  $('#app').appendChild(t);
  requestAnimationFrame(() => t.classList.add('buka'));
  document.body.style.overflow = 'hidden';
  return t;
}
function tutup(t) {
  if (!t || t.dataset.tutup) return;
  t.dataset.tutup = '1'; t.classList.remove('buka');
  if (t.id === 'lembar-detail') st.notaBuka = null;
  setTimeout(() => { t.remove(); if (!$('.tirai')) document.body.style.overflow = ''; }, 260);
}
const tutupDari = el => tutup(el.closest('.tirai'));

function tanya(judul, isi, teksYa) {
  return new Promise(selesai => {
    const t = document.createElement('div');
    t.className = 'tirai tengah';
    t.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><h2>${esc(judul)}</h2><p>${esc(isi)}</p>
      <div class="aksi"><button class="tombol sekunder" type="button" data-j="0">Batal</button><button class="tombol bahaya" type="button" data-j="1">${esc(teksYa)}</button></div></div>`;
    t.addEventListener('click', e => { const b = e.target.closest('[data-j]'); if (b) { tutup(t); selesai(b.dataset.j === '1'); } });
    $('#app').appendChild(t);
    requestAnimationFrame(() => t.classList.add('buka'));
  });
}

let waktuToast;
function toast(pesan, jenis) {
  const el = $('#toast');
  el.className = 'toast tampil ' + (jenis || 'info');
  el.innerHTML = ikon(jenis === 'ok' ? 'centang' : jenis === 'gagal' ? 'seru' : 'jam') + `<span>${esc(pesan)}</span>`;
  clearTimeout(waktuToast);
  waktuToast = setTimeout(() => el.classList.remove('tampil'), jenis === 'gagal' ? 5500 : 2800);
}

/* ================= Nota: tampilan, bagikan, cetak ================= */
function kertas(n, denganHapus) {
  const P = st.data.pengaturan, baris = (dt, dd) => dd ? `<dt>${dt}</dt><dd>${esc(dd)}</dd>` : '';
  const grup = jenis => {
    const it = n.items.filter(i => i.jenis === jenis);
    return it.length ? `<div class="k-jenis">${jenis === 'jasa' ? 'Jasa' : 'Sparepart'}</div>` + it.map(i => `<div class="k-item"><div>${esc(i.nama)}<small>${qtyT(i.qty)} × ${rp(i.harga)}</small></div><b>${rp(Math.round(i.qty * i.harga))}</b></div>`).join('') : '';
  };
  const cap = n.status === 'BATAL' ? ['batal', 'DIBATALKAN'] : n.status === 'LUNAS' ? ['lunas', 'LUNAS'] : ['belum', 'BELUM LUNAS'];
  return `<div class="kertas">
    <div class="k-kepala"><b>${esc(P.nama)}</b>${P.alamat ? `<span>${esc(P.alamat)}</span>` : ''}${P.telepon ? `<span>Telp/WA ${esc(P.telepon)}</span>` : ''}</div>
    <dl>${baris('No. nota', n.id)}${baris('Tanggal', F_PENDEK_TH.format(tgl(n.tanggal)))}${baris('Plat', n.plat)}${baris('Kendaraan', n.kendaraan)}${baris('Kilometer', n.km ? angka(n.km) + ' km' : '')}
      ${baris('Pelanggan', n.pelanggan)}${baris('No. HP', n.hp)}${baris('Mekanik', n.mekanik)}${baris('Kasir', n.kasir)}</dl>
    ${grup('jasa')}${grup('sparepart')}
    <div class="k-jumlah">
      ${n.diskon ? `<div class="k-baris"><span>Subtotal</span><span>${rp(n.subtotal)}</span></div><div class="k-baris"><span>Diskon</span><span>−${rp(n.diskon)}</span></div>` : ''}
      <div class="k-baris besar"><span>Total</span><span>${rp(n.total)}</span></div>
      ${n.bayar.map(b => `<div class="k-baris redup"><span>Bayar ${esc(b.metode)}, ${F_PENDEK.format(tgl(b.tanggal))}${denganHapus && bos() && !n.tunda && n.status !== 'BATAL' ? `<button type="button" data-a="hapusBayar" data-id="${esc(b.id)}">hapus</button>` : ''}</span><span>${rp(b.jumlah)}</span></div>`).join('')}
      ${n.status === 'BELUM LUNAS' ? `<div class="k-baris" style="font-weight:700"><span>Sisa tagihan</span><span>${rp(n.sisa)}</span></div>` : ''}
    </div>
    <div class="k-cap ${cap[0]}">${cap[1]}</div>

function teksNota(n) {
  const P = st.data.pengaturan, b = [`*${P.nama}*`];
  if (P.alamat) b.push(P.alamat);
  b.push('', `Nota ${n.id}`, F_PENDEK_TH.format(tgl(n.tanggal)));
  if (n.plat) b.push(`Plat: ${n.plat}${n.kendaraan ? ' (' + n.kendaraan + ')' : ''}`);
  if (n.km) b.push(`Kilometer: ${angka(n.km)}`);
  for (const jenis of ['jasa', 'sparepart']) {
    const it = n.items.filter(i => i.jenis === jenis);
    if (!it.length) continue;
    b.push('', jenis === 'jasa' ? '_Jasa_' : '_Sparepart_');
    it.forEach(i => b.push(`- ${i.nama} (${qtyT(i.qty)} × ${rp(i.harga)}) = ${rp(Math.round(i.qty * i.harga))}`));
  }
  b.push('');
  if (n.diskon) b.push(`Subtotal: ${rp(n.subtotal)}`, `Diskon: −${rp(n.diskon)}`);
  b.push(`Total: *${rp(n.total)}*`);
  n.bayar.forEach(x => b.push(`Bayar ${x.metode} ${F_PENDEK.format(tgl(x.tanggal))}: ${rp(x.jumlah)}`));
  b.push(n.status === 'BATAL' ? '*NOTA DIBATALKAN*' : n.status === 'LUNAS' ? '*LUNAS*' : `Sisa tagihan: *${rp(n.sisa)}*`);
  if (P.kaki) b.push('', P.kaki);
  return b.join('\n');
}

/** Nota sebagai gambar PNG (digambar di kanvas, tanpa library). */
function kanvasNota(n) {
  const P = st.data.pengaturan, L = 760, m = 48, H = '"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif', b = [];
  const pas = (c, s, maks) => { if (c.measureText(s).width <= maks) return s; while (s.length > 1 && c.measureText(s + '…').width > maks) s = s.slice(0, -1); return s + '…'; };
  const baris = (kiri, kanan, o = {}) => {
    const t = o.t || 40;
    b.push({ t, g: (c, y) => {
      c.font = `${o.tebal ? 700 : 400} ${o.u || 24}px ${H}`; c.fillStyle = o.warna || '#0f1535'; c.textBaseline = 'middle';
      let lk = 0;
      if (kanan != null) { c.textAlign = 'right'; c.fillText(kanan, L - m, y + t / 2); lk = c.measureText(kanan).width + 20; }
      c.textAlign = o.tengah ? 'center' : 'left';
      c.fillText(pas(c, String(kiri), L - 2 * m - lk), o.tengah ? L / 2 : m, y + t / 2);
    } });
  };
  const garis = putus => b.push({ t: 28, g: (c, y) => { c.strokeStyle = '#cfd4e3'; c.lineWidth = 2; c.setLineDash(putus ? [8, 8] : []); c.beginPath(); c.moveTo(m, y + 14); c.lineTo(L - m, y + 14); c.stroke(); c.setLineDash([]); } });
  const jeda = t => b.push({ t, g: () => {} });
  const redup = { u: 21, warna: '#56607f', t: 32 };

  jeda(40); baris(P.nama, null, { tengah: true, tebal: true, u: 42, t: 56 });
  if (P.alamat) baris(P.alamat, null, { ...redup, tengah: true });
  if (P.telepon) baris('Telp/WA ' + P.telepon, null, { ...redup, tengah: true });
  jeda(8); garis();
  [['No. nota', n.id], ['Tanggal', F_PENDEK_TH.format(tgl(n.tanggal))], ['Plat', n.plat], ['Kendaraan', n.kendaraan], ['Kilometer', n.km ? angka(n.km) + ' km' : ''],
    ['Pelanggan', n.pelanggan], ['Mekanik', n.mekanik], ['Kasir', n.kasir]].forEach(([k, v]) => { if (v) baris(k, v, { u: 23, t: 36 }); });
  for (const jenis of ['jasa', 'sparepart']) {
    const it = n.items.filter(i => i.jenis === jenis);
    if (!it.length) continue;
    garis(true); baris(jenis === 'jasa' ? 'Jasa' : 'Sparepart', null, { ...redup, tebal: true });
    it.forEach(i => { baris(i.nama, rp(Math.round(i.qty * i.harga)), { u: 24 }); baris(`${qtyT(i.qty)} × ${rp(i.harga)}`, null, { u: 20, warna: '#8c94ae', t: 28 }); jeda(4); });
  }
  garis(true);
  if (n.diskon) { baris('Subtotal', rp(n.subtotal), { u: 23, t: 36 }); baris('Diskon', '−' + rp(n.diskon), { u: 23, t: 36 }); }
  baris('Total', rp(n.total), { tebal: true, u: 32, t: 54 });
  n.bayar.forEach(x => baris(`Bayar ${x.metode}, ${F_PENDEK.format(tgl(x.tanggal))}`, rp(x.jumlah), redup));
  if (n.status === 'BELUM LUNAS') baris('Sisa tagihan', rp(n.sisa), { tebal: true, u: 26, t: 44 });
  jeda(10);
  baris(n.status === 'BATAL' ? 'DIBATALKAN' : n.status === 'LUNAS' ? 'LUNAS' : 'BELUM LUNAS', null, { tengah: true, tebal: true, u: 28, t: 48, warna: n.status === 'LUNAS' ? '#0b7d70' : n.status === 'BATAL' ? '#56607f' : '#9a5b00' });
  garis();
  if (n.catatan) baris('Catatan: ' + n.catatan, null, { ...redup, tengah: true });
  if (P.kaki) baris(P.kaki, null, { ...redup, tengah: true });
  jeda(36);

  const cv = document.createElement('canvas');
  cv.width = L; cv.height = b.reduce((a, x) => a + x.t, 0);
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  let y = 0;
  for (const x of b) { x.g(c, y); y += x.t; }
  return cv;
}

function totalForm() {

function gambarTotalNota() {

/* ================= Mode demo (data contoh, hanya di memori) ================= */
function buatDemo() {
  let benih = 20261116;
  const acakD = () => { benih = (benih * 1664525 + 1013904223) >>> 0; return benih / 4294967296; };
  const pilih = a => a[Math.floor(acakD() * a.length)];
  const barang = [['Oli Mesin 10W-40 1L', 95000, 72000, 14, 6], ['Filter Oli', 45000, 30000, 5, 4], ['Kampas Rem Depan', 285000, 210000, 3, 2], ['Busi Iridium', 115000, 85000, 9, 8], ['Aki 45Ah', 950000, 780000, 2, 1], ['Filter Udara', 120000, 85000, 6, 2], ['Air Radiator 1L', 35000, 22000, 0, 3], ['Wiper Set', 150000, 105000, 4, 2]]
    .map((b, i) => ({ kode: 'SP' + pad(i + 1).padStart(3, '0'), nama: b[0], jual: b[1], modal: b[2], stok: b[3], min: b[4], aktif: true }));
  const jasa = [['Ganti Oli', 30000], ['Tune Up', 250000], ['Servis Rem', 150000], ['Spooring Balancing', 200000], ['Servis AC', 350000], ['Cek Kelistrikan', 100000]].map((j, i) => ({ kode: 'JS' + pad(i + 1).padStart(3, '0'), nama: j[0], harga: j[1], aktif: true }));
  const mobil = [['DD 1234 AB', 'Avanza 2019', 'Pak Budi', '081234567890'], ['DD 88 XY', 'Xpander 2021', 'Bu Sari', '085299887766'], ['DD 5521 KL', 'Innova 2017', 'Pak Anwar', '081355512345'], ['DP 902 CA', 'Brio 2020', 'Kak Rina', ''], ['DD 1701 QZ', 'Rush 2018', 'Pak Yusuf', '082188112233'], ['DD 777 MM', 'Fortuner 2016', 'Pak Hendra', '081122334455']];
  const h = hariIni(), nota = [], pengeluaran = [];
  for (let i = 45; i >= 0; i--) {
    const s = geserHari(h, -i), n = Math.floor(acakD() * 4);
    for (let k = 0; k < n; k++) {
      const m = pilih(mobil), items = [], j = pilih(jasa);
      items.push({ jenis: 'jasa', kode: j.kode, nama: j.nama, qty: 1, harga: j.harga, modal: 0 });
      const nb = Math.floor(acakD() * 3);
      for (let q = 0; q < nb; q++) { const b = pilih(barang); if (!items.some(x => x.kode === b.kode)) items.push({ jenis: 'sparepart', kode: b.kode, nama: b.nama, qty: b.kode === 'SP001' ? 4 : 1, harga: b.jual, modal: b.modal }); }
      const subtotal = items.reduce((a, it) => a + it.qty * it.harga, 0), diskon = acakD() > .85 ? 20000 : 0, total = subtotal - diskon, cara = acakD();
      const dibayar = cara > .88 ? 0 : cara > .78 ? Math.round(total / 2 / 50000) * 50000 : total, dibuat = tgl(s).getTime() + (8 + k * 2.4) * 3600e3, kasir = pilih(['Tante Flo', 'Om Rudi', 'Dina', 'Oma']);
      nota.push({ id: 'AF-' + s.slice(2).replace(/-/g, '') + '-' + pilih(['K7Q2', 'M3XA', 'P9TB', 'R4HD', 'W6NC', 'Z2LE', 'B8YF', 'G5VG']) + k, tanggal: s, pelanggan: m[2], hp: m[3], plat: m[0], kendaraan: m[1], km: String(20000 + Math.floor(acakD() * 90000)), mekanik: 'Om Rudi',
        subtotal, diskon, total, dibayar, sisa: total - dibayar, status: total - dibayar <= 0 ? 'LUNAS' : 'BELUM LUNAS', catatan: '', kasir, dibuat, items,
        bayar: dibayar ? [{ id: 'b' + i + '_' + k, tanggal: s, metode: pilih(['Tunai', 'Tunai', 'Transfer', 'QRIS']), jumlah: dibayar, kasir, dibuat }] : [] });
    }
    if (i % 9 === 0) pengeluaran.push({ id: 'p' + i, tanggal: s, kategori: pilih(['Listrik & Air', 'Operasional', 'Konsumsi']), nominal: Math.round(100 + acakD() * 400) * 1000, catatan: '', kasir: 'Tante Flo', dibuat: tgl(s).getTime() + 17 * 3600e3 });
  }
  st.server = { ...KOSONG, versi: 'demo', nota, barang, jasa, pengeluaran, belanja: [{ tanggal: geserHari(h, -12), nama: 'Oli Mesin 10W-40 1L', qty: 24, nilai: 1728000 }],
    pengguna: [{ id: 'demo', nama: 'Tante Flo', peran: 'pemilik', aktif: true }, { id: 'u2', nama: 'Om Rudi', peran: 'kasir', aktif: true }, { id: 'u3', nama: 'Dina', peran: 'kasir', aktif: true }, { id: 'u4', nama: 'Oma', peran: 'kasir', aktif: true }],
    pengaturan: { ...KOSONG.pengaturan, alamat: 'Jl. Contoh No. 12, Makassar', telepon: '0812-0000-0000', mekanik: ['Om Rudi'] } };
  st.pernahMuat = true; st.waktuSinkron = Date.now();
}
